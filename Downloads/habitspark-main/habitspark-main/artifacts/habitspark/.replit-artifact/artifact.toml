kind = "mobile"
previewPath = "/"
title = "HabitSpark"
version = "1.0.0"
id = "artifacts/habitspark"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21680

[services.development]
run = "pnpm --filter @workspace/habitspark run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habitspark", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/habitspark", "run", "serve" ]

[services.env]
PORT = "21680"
BASE_PATH = "/"
