kind = "web"
previewPath = "/"
title = "EduLeads Kerala Frontend"
version = "1.0.0"
id = "artifacts/edulead-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21594

[services.development]
run = "pnpm --filter @workspace/edulead-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edulead-frontend", "run", "build" ]
publicDir = "artifacts/edulead-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21594"
BASE_PATH = "/"
